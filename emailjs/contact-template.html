<!DOCTYPE html>
<!--
  EmailJS template for the portfolio contact form. Paste all of it into the EmailJS code editor.
  Needs these variables, sent by src/components/ContactUs.tsx: name, email, message, time, lang.
  Icons are PNGs hosted on the site (public/email/*.png), so deploy the site first.
  (No curly-brace variables inside comments on purpose: EmailJS fills them in everywhere.)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>New message from {{name}}</title>
  <style>
    body { margin: 0; padding: 0; }
    img { border: 0; outline: none; text-decoration: none; }

    /* Phones: use the full width, tighter padding, and a full-width reply button. */
    @media only screen and (max-width: 600px) {
      .email-container { width: 100% !important; }
      .outer { padding: 12px 8px !important; }
      .pad { padding-left: 20px !important; padding-right: 20px !important; }
      .title { font-size: 20px !important; }
      .btn-table { width: 100% !important; }
      .btn { display: block !important; padding: 14px 20px !important; text-align: center !important; }
    }
  </style>
</head>

<body
  style="
    margin: 0;
    padding: 0;
    width: 100% !important;
    background-color: #f1f5f9;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, Tahoma, sans-serif;
  "
>
  <!-- Inbox preview line (hidden inside the email itself) -->
  <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: transparent; font-size: 1px">
    {{name}}: {{message}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f1f5f9">
    <tr>
      <td align="center" class="outer" style="padding: 24px 12px">
        <table
          role="presentation"
          class="email-container"
          width="600"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-top: 4px solid #0284c7;
            border-radius: 12px;
          "
        >
          <!-- Header: logo + where it came from -->
          <tr>
            <td class="pad" style="padding: 22px 28px 0">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align: middle">
                    <img
                      src="https://www.amirrahemi.com/logo.png"
                      width="36"
                      height="36"
                      alt="Amir Rahemi"
                      style="display: block; border-radius: 8px"
                    />
                  </td>
                  <td style="padding-left: 12px; vertical-align: middle; font-size: 13px; line-height: 1.4; color: #64748b">
                    New contact message<br />
                    <a href="https://www.amirrahemi.com" style="color: #0f172a; font-weight: 600; text-decoration: none"
                      >From amirrahemi.com</a
                    >
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td class="pad" style="padding: 22px 28px 0">
              <h1
                class="title"
                style="margin: 0; font-size: 24px; line-height: 1.3; font-weight: 700; color: #0f172a; word-break: break-word"
              >
                {{name}} sent you a message
              </h1>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td class="pad" style="padding: 24px 28px 0">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align: middle">
                    <img
                      src="https://www.amirrahemi.com/email/icon-message.png"
                      width="32"
                      height="32"
                      alt=""
                      style="display: block"
                    />
                  </td>
                  <td
                    style="
                      padding-left: 12px;
                      vertical-align: middle;
                      font-size: 12px;
                      font-weight: 600;
                      letter-spacing: 0.06em;
                      text-transform: uppercase;
                      color: #64748b;
                    "
                  >
                    Message
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="pad" style="padding: 12px 28px 0">
              <!-- dir="auto": Persian messages read right-to-left. pre-wrap keeps line breaks, so keep the message variable glued to the tags. -->
              <div
                dir="auto"
                style="
                  padding: 16px 18px;
                  background-color: #f8fafc;
                  border: 1px solid #e2e8f0;
                  border-left: 3px solid #0284c7;
                  border-radius: 8px;
                  font-size: 16px;
                  line-height: 1.65;
                  color: #1e293b;
                  white-space: pre-wrap;
                  word-break: break-word;
                "
              >{{message}}</div>
            </td>
          </tr>

          <!-- Sender details -->
          <tr>
            <td class="pad" style="padding: 28px 28px 0">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td colspan="2" style="padding: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #64748b">
                    Sender
                  </td>
                </tr>
                <tr>
                  <td width="44" style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <img src="https://www.amirrahemi.com/email/icon-user.png" width="32" height="32" alt="Name" style="display: block" />
                  </td>
                  <td style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <div style="font-size: 12px; color: #64748b">Name</div>
                    <div style="font-size: 16px; font-weight: 600; color: #0f172a; word-break: break-word">{{name}}</div>
                  </td>
                </tr>
                <tr>
                  <td width="44" style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <img src="https://www.amirrahemi.com/email/icon-mail.png" width="32" height="32" alt="Email" style="display: block" />
                  </td>
                  <td style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <div style="font-size: 12px; color: #64748b">Email</div>
                    <div style="font-size: 16px; word-break: break-all">
                      <a href="mailto:{{email}}" style="color: #0284c7; text-decoration: none">{{email}}</a>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td width="44" style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <img src="https://www.amirrahemi.com/email/icon-clock.png" width="32" height="32" alt="Received" style="display: block" />
                  </td>
                  <td style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <div style="font-size: 12px; color: #64748b">Received</div>
                    <div style="font-size: 16px; color: #0f172a">{{time}}</div>
                  </td>
                </tr>
                <tr>
                  <td width="44" style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <img src="https://www.amirrahemi.com/email/icon-globe.png" width="32" height="32" alt="Site language" style="display: block" />
                  </td>
                  <td style="padding: 12px 0; border-top: 1px solid #e2e8f0; vertical-align: middle">
                    <div style="font-size: 12px; color: #64748b">Site language</div>
                    <div style="font-size: 16px; color: #0f172a">{{lang}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Reply button (full width on phones) -->
          <tr>
            <td class="pad" style="padding: 20px 28px 28px">
              <table role="presentation" class="btn-table" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#0284c7" style="background-color: #0284c7; border-radius: 8px; text-align: center">
                    <a
                      href="mailto:{{email}}?subject=Re%3A%20Your%20message%20on%20amirrahemi.com"
                      class="btn"
                      style="
                        display: inline-block;
                        padding: 13px 24px;
                        font-size: 16px;
                        font-weight: 600;
                        line-height: 18px;
                        color: #ffffff;
                        text-decoration: none;
                        border-radius: 8px;
                      "
                    >
                      <img
                        src="https://www.amirrahemi.com/email/icon-reply.png"
                        width="18"
                        height="18"
                        alt=""
                        style="vertical-align: middle; margin-right: 8px"
                      />
                      <span style="vertical-align: middle">Reply to {{name}}</span>
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="pad" style="padding: 18px 28px; border-top: 1px solid #e2e8f0; font-size: 12px; line-height: 1.6; color: #94a3b8">
              Sent from the contact form on
              <a href="https://www.amirrahemi.com" style="color: #94a3b8; text-decoration: underline">amirrahemi.com</a><br />
              &copy; Amir Rahemi
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
